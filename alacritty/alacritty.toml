[env]
FOO = "bar"
[window]
dimensions = { columns = 180, lines = 40 }
position = { x = 40, y = 40 }
padding = { x = 10, y = 10 }
decorations = "Full"
opacity = 1
startup_mode = "Windowed"
[font]
normal = { family = "0xProto Nerd Font", style = "Regular" }
[colors]
primary = { foreground = "#d8d8d8", background = "#211a40" }
cursor = { text = "CellBackground", cursor = "CellForeground" }
vi_mode_cursor = { text = "CellBackground", cursor = "CellForeground" }
transparent_background_colors = true
draw_bold_text_with_bright_colors = true
[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "On" }
thickness = 0.5
[mouse]
hide_when_typing = true
[keyboard]
bindings = [
    { key = "W", mods = "Control|Shift", action = "Quit" },
]
